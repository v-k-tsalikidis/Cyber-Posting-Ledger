name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares support for 3.10 upward, so it is tested
        # there. A syntax feature added in 3.12 had already slipped in
        # unnoticed while nothing checked the older versions.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Install static analysis tools
        run: python -m pip install ruff==0.15.4 mypy==1.19.1

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy

      - name: Unit tests
        run: python -m pytest -q

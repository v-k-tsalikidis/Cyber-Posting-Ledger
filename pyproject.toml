[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-vacancy-tracker"
version = "0.1.0"
description = "Local-first cybersecurity vacancy & career intelligence assessment engine"
readme = "README.md"
authors = [
    { name = "Vasileios Tsalikidis" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cyber-vacancy-tracker = "cyber_vacancy_tracker.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
